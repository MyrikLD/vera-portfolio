description: >-
  Designed and assembled levels for hidden object and casual mobile games — Sort
  Puzzle: Water Color Game, Bright Objects, Tidy Shelf, Clever Hunt: Hidden
  Objects.


  Created visually clear and gameplay-oriented scenes with strong attention to
  composition, readability, and player experience. Worked on hidden object scene
  structure, object placement, and gameplay flow balancing.


  Collaborated with artists, game designers, QA, and developers throughout
  different stages of production.
